[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscience-agent"
version = "0.1.0"
description = "Wrap the AgentScience prompt-driven research agent behind RELAI's build_agent/run_agent shape so RELAI can optimize its prompt (prompt-only scope) via a headless Claude Code harness."
requires-python = ">=3.10"
authors = [{ name = "RELAI x Rippletide integration" }]
keywords = ["relai", "agentscience", "prompt-optimization", "llm-agents"]
# Needed so the simulator adapter can call DiscoveryBench's own evaluator.
# Declared here rather than installed by hand because optimizer workspaces are
# fresh checkouts that rebuild the venv from `uv pip install -e $ROOT_DIR`; a
# manually installed package would be absent there.
dependencies = [
    "openai>=1.40",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "sympy",
    "ipython",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentscience_agent"]
